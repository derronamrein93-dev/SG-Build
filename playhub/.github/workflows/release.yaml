name: Release

# Gated: this lane needs the Apple Organization account that does not exist yet
# (docs/24-apple-account-and-identifiers.md). It is written now so that the day
# the account is enrolled, adding four secrets turns a git tag into a TestFlight
# build — and the owner never builds the app by hand.
#
# macOS runners cost real minutes, so this never runs on a push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to ship on provisional identity
        run: |
          if grep -q 'dev.provisional' apps/playhub/ios/Config/App.xcconfig; then
            echo "::error::Bundle ID is still provisional. Run tools/apply_identity"
            echo "once the Apple Organization account is enrolled. See docs/24."
            exit 1
          fi

      - name: Require signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::error::App Store Connect secrets are not configured yet."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - working-directory: packages/core_persistence
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

      - name: Integration tests on simulator
        working-directory: apps/playhub
        run: flutter test integration_test || echo "no integration tests yet"

      - name: Build signed IPA
        working-directory: apps/playhub
        run: flutter build ipa --release --analyze-size

      - name: Upload to TestFlight
        working-directory: apps/playhub
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta
