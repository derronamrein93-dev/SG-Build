; Stride Guide - ESP32 plantar pressure scanner firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Library versions are pinned to a compatible major line so a future checkout
; builds the same firmware. Bump deliberately, not incidentally.
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    bogde/HX711@^0.7.5

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; ---------------------------------------------------------------------------
; esp32dev - generic ESP32 dev board. This is the bring-up target used before
; the custom Stride Guide PCB exists.
; TODO(pcb): add a `stride_pcb` env once the production board and its
; variant/pin definitions are finalized.
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
board_build.partitions = default.csv

; Simulation build: no physical sensors required. Same sources, SIMULATION_MODE
; forced on so the whole device-to-cloud pipeline can be exercised on a bare
; dev board.
[env:esp32dev-sim]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSIMULATION_MODE=1

; Hardware build: real sensor acquisition.
[env:esp32dev-hw]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSIMULATION_MODE=0
